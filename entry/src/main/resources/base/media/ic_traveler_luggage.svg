<svg viewBox="0 0 240 240" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="60%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="luggageMetallic" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="25%" stop-color="#BAE6FD" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="75%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1. 脚下地表真实微弱投影 -->
  <ellipse cx="140" cy="225" rx="35" ry="6" fill="#000000" opacity="0.6" />
  <ellipse cx="65" cy="222" rx="20" ry="4" fill="#000000" opacity="0.4" />

  <!-- 2. 真实 3D 铝合金 Rimowa 风格时尚行李箱 (倾斜 20°) -->
  <g transform="translate(65, 155) rotate(-20)">
    <!-- 金属双杆拉杆与黑胶手柄 -->
    <rect x="8" y="-45" width="4" height="48" rx="2" fill="#94A3B8" />
    <rect x="32" y="-45" width="4" height="48" rx="2" fill="#94A3B8" />
    <rect x="5" y="-48" width="34" height="7" rx="3.5" fill="#0F172A" stroke="#CBD5E1" stroke-width="1" />

    <!-- 真实箱体 (圆角/压痕立条) -->
    <rect x="0" y="0" width="44" height="64" rx="8" fill="url(#luggageMetallic)" stroke="#F8FAFC" stroke-width="2" />
    <!-- 立体铠甲条纹 -->
    <line x1="11" y1="6" x2="11" y2="58" stroke="rgba(255,255,255,0.4)" stroke-width="2" />
    <line x1="22" y1="6" x2="22" y2="58" stroke="rgba(255,255,255,0.4)" stroke-width="2" />
    <line x1="33" y1="6" x2="33" y2="58" stroke="rgba(255,255,255,0.4)" stroke-width="2" />
    <!-- 暖琥珀橙登机行包标牌 -->
    <rect x="12" y="16" width="20" height="12" rx="3" fill="#FF9500" />
    <circle cx="16" cy="22" r="2" fill="#FFFFFF" />

    <!-- 顶部 TSA 海关锁与皮革手把 -->
    <rect x="17" y="-5" width="10" height="6" rx="2" fill="#64748B" />

    <!-- 3D 旋转万向双轮 -->
    <circle cx="10" cy="67" r="5" fill="#1E293B" stroke="#94A3B8" stroke-width="1.5" />
    <circle cx="34" cy="67" r="5" fill="#1E293B" stroke="#94A3B8" stroke-width="1.5" />
    <circle cx="10" cy="67" r="2" fill="#F8FAFC" />
    <circle cx="34" cy="67" r="2" fill="#F8FAFC" />
  </g>

  <!-- 3. 写实商务飞行员剪影 (Real Human Anatomy) -->
  <!-- 头部：发型剪影、耳机、脸部侧影 -->
  <path d="M 132 30 C 122 30, 116 38, 116 48 C 116 54, 120 60, 125 64 C 128 66, 134 68, 138 68 C 146 68, 152 60, 152 50 C 152 38, 144 30, 132 30 Z" fill="#F8FAFC" />
  <!-- 发型与面部侧廓精致裁切 -->
  <path d="M 126 30 C 120 34, 116 42, 116 48 C 116 55, 122 58, 126 56 C 122 50, 124 38, 134 32 Z" fill="#0F172A" />
  <!-- 智能全息眼镜/耳机 -->
  <rect x="128" y="44" width="20" height="6" rx="3" fill="#38BDF8" filter="url(#softGlow)" />

  <!-- 颈部 -->
  <rect x="131" y="66" width="10" height="8" rx="2" fill="#CBD5E1" />

  <!-- 商务大风衣躯干 (挺拔剪裁) -->
  <path d="M 115 74 C 126 71, 144 71, 158 74 L 164 100 L 152 155 L 122 155 L 110 100 Z" fill="url(#suitGrad)" />
  <!-- 风衣领口翻领 -->
  <path d="M 131 74 L 136 94 L 141 74 Z" fill="#F8FAFC" opacity="0.9" />

  <!-- 正向迈步右腿 (西裤与鞋) -->
  <path d="M 144 152 L 168 215 L 180 220 C 184 221, 186 225, 178 225 L 160 225 Z" fill="#1E3A8A" />
  <!-- 亮黑皮鞋 -->
  <path d="M 160 218 L 184 220 C 188 222, 186 226, 176 226 L 158 226 Z" fill="#38BDF8" />

  <!-- 迈步左腿 (后方) -->
  <path d="M 128 152 L 108 215 L 94 220 L 98 225 L 118 222 Z" fill="#0F172A" opacity="0.9" />

  <!-- 自然摆动手臂 (右臂) -->
  <path d="M 152 80 C 162 95, 168 112, 160 135" stroke="#F8FAFC" stroke-width="6" stroke-linecap="round" fill="none" />

  <!-- 拉着行李箱手柄的手臂 (左臂) -->
  <path d="M 120 80 L 102 118 L 88 126" stroke="#F8FAFC" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <!-- 抓手 (黑色手套) -->
  <circle cx="86" cy="127" r="4.5" fill="#0F172A" />
</svg>
