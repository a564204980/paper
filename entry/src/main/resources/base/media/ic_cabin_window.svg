<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <!-- Outer aircraft passenger window frame -->
  <rect x="5.5" y="2.5" width="13" height="19" rx="6.5" ry="6.5" stroke="#1E293B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Inner window glass opening -->
  <rect x="8" y="5" width="8" height="14" rx="4" ry="4" stroke="#1E293B" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
  <!-- Subtle glass sunlight reflection accent -->
  <line x1="10" y1="8" x2="13.5" y2="12" stroke="#1E293B" stroke-width="1.2" stroke-linecap="round" opacity="0.60"/>
</svg>
