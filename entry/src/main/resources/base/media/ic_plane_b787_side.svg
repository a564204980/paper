  <!-- 客舱门 L1 / L2 / L3 -->
  <rect x="156" y="124" width="7" height="18" rx="1" stroke="#F8FAFC" stroke-width="1" fill="none" opacity="0.8" />
  <rect x="296" y="124" width="7" height="18" rx="1" stroke="#F8FAFC" stroke-width="1" fill="none" opacity="0.8" />
  <rect x="610" y="124" width="7" height="18" rx="1" stroke="#F8FAFC" stroke-width="1" fill="none" opacity="0.8" />

  <!-- 机身彩绘标语 (in support of the UN) -->
  <text x="500" y="143" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="bold" fill="#F8FAFC" opacity="0.95">in support of the UN</text>

  <!-- 3. 后平尾 (Horizontal Stabilizer) -->
  <path d="M 660 142 L 760 144 L 748 149 L 650 145 Z" fill="#64748B" />

  <!-- 4. 超后掠大展弦比机翼 (B787 Raked Wingtip Wing) -->
  <path d="M 310 140 L 590 95 C 605 92, 595 97, 570 105 L 360 146 Z" fill="url(#wingGrad)" stroke="#F8FAFC" stroke-width="1" />

  <!-- 5. 巨型 GEnx 发动机引擎舱 (Engine Nacelle with Serrated Chevrons) -->
  <g transform="translate(305, 132)">
    <!-- 锯齿形喷口 -->
    <path d="M 52 8 L 64 6 L 56 12 L 64 18 L 54 24 L 64 28 L 52 32 Z" fill="#1E293B" />
    <!-- 引擎舱外壳 -->
    <path d="M 0 10 C 5 -2, 45 -2, 54 6 C 56 18, 56 30, 48 36 C 30 38, 5 36, 0 24 Z" fill="url(#engineGrad)" stroke="#F8FAFC" stroke-width="1" />
    <!-- 红色进气口防撞圈 -->
    <ellipse cx="2" cy="18" rx="2" ry="11" fill="#EF4444" />
  </g>
