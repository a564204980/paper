    <rect x="480" y="130" width="3" height="4" rx="1.5" />
    <rect x="488" y="130" width="3" height="4" rx="1.5" />
    <rect x="496" y="130" width="3" height="4" rx="1.5" />
    <rect x="504" y="130" width="3" height="4" rx="1.5" />
    <rect x="512" y="130" width="3" height="4" rx="1.5" />
    <rect x="520" y="130" width="3" height="4" rx="1.5" />
    <rect x="528" y="130" width="3" height="4" rx="1.5" />
    <rect x="536" y="130" width="3" height="4" rx="1.5" />
    <rect x="544" y="130" width="3" height="4" rx="1.5" />
    <rect x="552" y="130" width="3" height="4" rx="1.5" />
    <rect x="620" y="130" width="3" height="4" rx="1.5" />
