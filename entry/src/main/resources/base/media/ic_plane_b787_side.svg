    <rect x="370" y="130" width="3" height="4" rx="1.5" />
    <rect x="378" y="130" width="3" height="4" rx="1.5" />
    <rect x="386" y="130" width="3" height="4" rx="1.5" />
    <rect x="394" y="130" width="3" height="4" rx="1.5" />
    <rect x="402" y="130" width="3" height="4" rx="1.5" />
