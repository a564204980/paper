<svg viewBox="0 0 800 240" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fuselageGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="35%" stop-color="#0284C7" />
      <stop offset="75%" stop-color="#0369A1" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="wingGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CBD5E1" />
      <stop offset="60%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>
    <linearGradient id="engineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="70%" stop-color="#64748B" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
  </defs>

  <!-- 1. 垂直尾翼 (Vertical Stabilizer) -->
  <path d="M 620 115 L 730 20 L 755 20 L 730 115 Z" fill="#0284C7" stroke="#F8FAFC" stroke-width="1.5" />
  <!-- 尾翼白鹭/航空 Logo -->
  <circle cx="718" cy="50" r="12" fill="#F8FAFC" />
  <path d="M 712 50 Q 718 42 724 50 Q 718 47 712 50 Z" fill="#0284C7" />

  <!-- 2. 主机身 (Boeing 787 Streamlined Fuselage) -->
  <path d="M 90 138 C 110 118, 160 115, 680 115 C 720 115, 755 125, 765 132 C 772 135, 765 140, 700 144 C 550 152, 200 152, 110 145 C 95 143, 85 142, 90 138 Z" fill="url(#fuselageGrad)" stroke="rgba(255,255,255,0.4)" stroke-width="1" />

  <!-- 机头风挡玻璃 (Cockpit Windows) -->
  <path d="M 95 133 C 102 127, 115 127, 122 132 L 122 137 L 98 137 Z" fill="#0F172A" stroke="#38BDF8" stroke-width="1" />

