<svg width="300" height="500" viewBox="0 0 300 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 左上角微亮斜向渐变 -->
    <linearGradient id="topLeftGlow" x1="0" y1="0" x2="300" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#505154"/>
      <stop offset="35%" stop-color="#414245"/>
      <stop offset="70%" stop-color="#323335"/>
      <stop offset="100%" stop-color="#242527"/>
    </linearGradient>
    <!-- 卡片外轮廓剪裁蒙版 -->
    <clipPath id="cardClip">
      <path d="M 24 0 L 276 0 A 24 24 0 0 1 300 24 L 300 141 C 300 154.5, 286 151.5, 286 165 C 286 178.5, 300 175.5, 300 189 L 300 476 A 24 24 0 0 1 276 500 L 24 500 A 24 24 0 0 1 0 476 L 0 189 C 0 175.5, 14 178.5, 14 165 C 14 151.5, 0 154.5, 0 141 L 0 24 A 24 24 0 0 1 24 0 Z"/>
    </clipPath>
  </defs>

  <!-- 1. 卡片主体 (斜向微光渐变实心底板) -->
  <path d="M 24 0 L 276 0 A 24 24 0 0 1 300 24 L 300 141 C 300 154.5, 286 151.5, 286 165 C 286 178.5, 300 175.5, 300 189 L 300 476 A 24 24 0 0 1 276 500 L 24 500 A 24 24 0 0 1 0 476 L 0 189 C 0 175.5, 14 178.5, 14 165 C 14 151.5, 0 154.5, 0 141 L 0 24 A 24 24 0 0 1 24 0 Z" fill="url(#topLeftGlow)"/>

  <!-- 2. 会员专属底栏 (上弧度与下圆角 100% 同为 R=24，降低透明度至 0.88) -->
  <g clip-path="url(#cardClip)">
    <path d="M 0 438 A 24 24 0 0 0 24 462 L 276 462 A 24 24 0 0 0 300 438 L 300 476 A 24 24 0 0 1 276 500 L 24 500 A 24 24 0 0 1 0 476 Z" fill="#0D2554" fill-opacity="0.88"/>
  </g>

  <!-- 3. 卡片外轮廓精密微光描边 -->
  <path d="M 24 0 L 276 0 A 24 24 0 0 1 300 24 L 300 141 C 300 154.5, 286 151.5, 286 165 C 286 178.5, 300 175.5, 300 189 L 300 476 A 24 24 0 0 1 276 500 L 24 500 A 24 24 0 0 1 0 476 L 0 189 C 0 175.5, 14 178.5, 14 165 C 14 151.5, 0 154.5, 0 141 L 0 24 A 24 24 0 0 1 24 0 Z" stroke="rgba(255,255,255,0.12)" stroke-width="1" fill="none"/>
</svg>
